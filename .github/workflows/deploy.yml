name: Deploy

on:
  push:
    branches: [main]

# Only one deploy at a time; a newer push waits rather than racing the older one
# onto the server (never cancel-in-progress — a half-finished deploy is worse).
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  REMOTE_ROOT: /srv/volthub

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: BE/package-lock.json

      - name: Install dependencies
        working-directory: BE
        run: npm ci

      - name: Generate Prisma client
        working-directory: BE
        run: npx prisma generate

      - name: Run build
        working-directory: BE
        run: npm run build

      # tsc has rootDir=./src, so prisma/ is not emitted into dist/. The deploy
      # step runs `prisma migrate deploy --schema=dist/prisma/schema.prisma`, so
      # stage the schema + migrations into the artifact for that path to resolve.
      - name: Stage Prisma schema and migrations into dist
        working-directory: BE
        run: cp -r prisma dist/prisma

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: BE/dist/
          if-no-files-found: error
          retention-days: 7

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FE/package-lock.json

      - name: Install dependencies
        working-directory: FE
        run: npm ci

      # FE/.env.production is gitignored, so it does not exist on the runner and
      # vite would fall through to the "http://localhost:3001/api" dev fallback
      # baked into lib/api/client.ts — shipping a bundle that calls localhost
      # from the user's browser. Supply the real API origin at build time.
      - name: Run build
        working-directory: FE
        env:
          VITE_API_URL: https://volthub.nkniryagrp.my.id/api
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: FE/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    # Runs ON the deploy server itself, so every path below is local — no SSH,
    # no scp. The build jobs stay on GitHub's cloud runners.
    runs-on: self-hosted
    needs: [build-backend, build-frontend]
    steps:
      # This job's workspace does not inherit the build jobs' checkouts. Check
      # out just the two backend manifests that `npm ci --omit=dev` needs. Must
      # run before the artifact downloads, since checkout cleans the directory.
      - name: Checkout backend package manifests
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            BE/package.json
            BE/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: artifacts/backend-dist

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/frontend-dist

      # --delete so stale files from a previous build (renamed modules, old
      # content-hashed Vite chunks) are removed rather than accumulating.
      - name: Copy backend to server
        run: |
          rsync -az --delete artifacts/backend-dist/. /srv/volthub/backend/dist/
          cp BE/package.json BE/package-lock.json /srv/volthub/backend/

      - name: Copy frontend to server
        run: |
          rsync -az --delete artifacts/frontend-dist/. /srv/volthub/frontend/dist/

      - name: Release
        run: |
          cd /srv/volthub
          docker compose up -d
          cd /srv/volthub/backend
          npm ci --omit=dev --prefix /srv/volthub/backend
          # `npm ci` wipes node_modules, which takes the generated client in
          # node_modules/.prisma/client with it, and --omit=dev then drops the
          # prisma CLI itself. So regenerate against the schema shipped in
          # dist/, and pin the CLI to the exact version in the lockfile — a
          # bare `npx prisma` would pull the latest major and generate a client
          # mismatched with the installed @prisma/client.
          PRISMA_VERSION="$(node -p "require('./package-lock.json').packages['node_modules/prisma'].version")"
          npx --yes "prisma@${PRISMA_VERSION}" generate --schema=dist/prisma/schema.prisma
          npx --yes "prisma@${PRISMA_VERSION}" migrate deploy --schema=dist/prisma/schema.prisma
          pm2 restart volthub-be --update-env
          pm2 save
