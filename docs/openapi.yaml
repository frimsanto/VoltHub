      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — insufficient role
        '404':
          description: Not Found
        '409':
          description: Conflict — duplicate data
        '422':
          description: Validation / business rule error
  /feeders/{id}:
    get:
      tags:
        - Feeders
      summary: Get feeder by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
