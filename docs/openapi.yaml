openapi: 3.0.3
info:
  title: VoltReport V2 — Asset Management API
  version: 2.0.0
  description: >-
    Sprint 1: Locations, Feeders, Assets, Asset SIM Cards, Communication Media. All responses follow the ApiResponse
    envelope `{ success, message, data, meta }`.
servers:
  - url: /api/v1
    description: V2 base path
tags:
  - name: Locations
  - name: Feeders
  - name: Assets
  - name: Asset SIM Cards
  - name: Communication Media
  - name: Inspections
  - name: HAR
  - name: Documents
  - name: Reports
  - name: Imports
  - name: AI
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Location:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        locationType:
          type: string
          enum:
            - GI
            - GH
            - GARDU
        up3:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        status:
          type: boolean
        scadaOperState:
          type: string
          nullable: true
          description: >-
            Oper State RTU dari snapshot SP7 terbaru (UP = RC Inscan, selain itu
            = RC OOP). Null bila gardu tidak terdaftar di snapshot.
    CreateLocation:
      type: object
      required:
        - name
        - locationType
      properties:
        code:
          type: string
          description: Optional — auto-generated server-side from `name` when omitted.
        name:
          type: string
        locationType:
          type: string
          enum:
            - GI
            - GH
            - GARDU
        up3:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        status:
          type: boolean
          default: true
    UpdateLocation:
      allOf:
        - $ref: '#/components/schemas/CreateLocation'
    Feeder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        feederCode:
          type: string
        feederName:
          type: string
    CreateFeeder:
      type: object
      required:
        - locationId
        - feederName
      properties:
        locationId:
          type: string
          format: uuid
        feederCode:
          type: string
          description: Optional — auto-generated server-side from `feederName` when omitted.
        feederName:
          type: string
    UpdateFeeder:
      allOf:
        - $ref: '#/components/schemas/CreateFeeder'
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        feederId:
          type: string
          format: uuid
          nullable: true
        parentAssetId:
          type: string
          format: uuid
          nullable: true
        assetType:
          type: string
          enum:
            - RTU
            - FDI
            - RECTIFIER
            - BATTERY_BANK
            - ROUTER
            - MODEM
            - RADIO
        assetCode:
          type: string
        assetName:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - WARNING
            - DAMAGED
            - RETIRED
    CreateAsset:
      type: object
      required:
        - locationId
        - assetType
        - assetName
      properties:
        locationId:
          type: string
          format: uuid
        feederId:
          type: string
          format: uuid
          nullable: true
        parentAssetId:
          type: string
          format: uuid
          nullable: true
        assetType:
          type: string
          enum:
            - RTU
            - FDI
            - RECTIFIER
            - BATTERY_BANK
            - ROUTER
            - MODEM
            - RADIO
        assetCode:
          type: string
          description: Optional — auto-generated server-side from `assetName` when omitted.
        assetName:
          type: string
        brand:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        serialNumber:
          type: string
          nullable: true
        tahunOperasi:
          type: integer
          nullable: true
        status:
          type: string
          enum:
            - ACTIVE
            - WARNING
            - DAMAGED
            - RETIRED
        notes:
          type: string
          nullable: true
        protocol:
          type: string
          nullable: true
        asdu:
          type: string
          nullable: true
        linkAddress:
          type: string
          nullable: true
        pairChannel:
          type: string
          nullable: true
        masterIp1:
          type: string
          nullable: true
        masterIp2:
          type: string
          nullable: true
        batteryCount:
          type: integer
          nullable: true
        capacity:
          type: string
          nullable: true
    UpdateAsset:
      allOf:
        - $ref: '#/components/schemas/CreateAsset'
    SimCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        simSlot:
          type: integer
        provider:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        iccid:
          type: string
          nullable: true
        ipAddress:
          type: string
          nullable: true
    CreateSimCard:
      type: object
      required:
        - simSlot
      properties:
        simSlot:
          type: integer
          minimum: 1
        provider:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        iccid:
          type: string
          nullable: true
        ipAddress:
          type: string
          nullable: true
    UpdateSimCard:
      allOf:
        - $ref: '#/components/schemas/CreateSimCard'
    CommunicationMedia:
      type: object
      properties:
        id:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        mediaType:
          type: string
          enum:
            - GSM_4G
            - GSM_2G
            - RADIO_DATA
            - FO
            - ICON_GSM
            - ICON_IPVPN
        provider:
          type: string
          nullable: true
        status:
          type: boolean
        notes:
          type: string
          nullable: true
    CreateCommunicationMedia:
      type: object
      required:
        - locationId
        - mediaType
      properties:
        locationId:
          type: string
          format: uuid
        mediaType:
          type: string
          enum:
            - GSM_4G
            - GSM_2G
            - RADIO_DATA
            - FO
            - ICON_GSM
            - ICON_IPVPN
        provider:
          type: string
          nullable: true
        status:
          type: boolean
          default: true
        notes:
          type: string
          nullable: true
    UpdateCommunicationMedia:
      allOf:
        - $ref: '#/components/schemas/CreateCommunicationMedia'
    CreateInspection:
      type: object
      required:
        - locationId
        - inspectionDate
      properties:
        locationId:
          type: string
          format: uuid
        inspectionDate:
          type: string
          format: date
          example: '2026-06-01'
        notes:
          type: string
          nullable: true
    CreateFinding:
      type: object
      required:
        - assetId
        - status
      properties:
        assetId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - NORMAL
            - WARNING
            - CRITICAL
        finding:
          type: string
          nullable: true
        recommendation:
          type: string
          nullable: true
    CreateHarReport:
      type: object
      required:
        - locationId
        - reportDate
      properties:
        locationId:
          type: string
          format: uuid
        reportDate:
          type: string
          format: date
          example: '2026-06-01'
    CreateHarDetail:
      type: object
      required:
        - assetId
        - status
      properties:
        assetId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - NORMAL
            - WARNING
            - CRITICAL
            - OFFLINE
        analysis:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
    UpdateHarDetail:
      type: object
      properties:
        status:
          type: string
          enum:
            - NORMAL
            - WARNING
            - CRITICAL
            - OFFLINE
        analysis:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
    GenerateInspectionReport:
      type: object
      required:
        - inspectionId
      properties:
        inspectionId:
          type: string
          format: uuid
    GenerateHarReport:
      type: object
      required:
        - harReportId
      properties:
        harReportId:
          type: string
          format: uuid
paths:
  /locations:
    get:
      tags:
        - Locations
      summary: List location
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum:
              - GI
              - GH
              - GARDU
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Location'
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 20
                      total:
                        type: integer
                        example: 42
                      totalPages:
                        type: integer
                        example: 3
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — insufficient role
        '404':
          description: Not Found
        '409':
          description: Conflict — duplicate data
        '422':
          description: Validation / business rule error
    post:
      tags:
        - Locations
      summary: 'Create location (roles: SUPERADMIN, ADMIN)'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocation'
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — insufficient role
        '404':
          description: Not Found
        '409':
          description: Conflict — duplicate data
        '422':
          description: Validation / business rule error
  /locations/{id}:
    get:
      tags:
        - Locations
      summary: Get location by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — insufficient role
        '404':
          description: Not Found
        '409':
          description: Conflict — duplicate data
        '422':
          description: Validation / business rule error
    put:
      tags:
        - Locations
      summary: 'Update location (roles: SUPERADMIN, ADMIN)'
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocation'
      responses:
        '200':
          description: Updated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — insufficient role
        '404':
          description: Not Found
        '409':
          description: Conflict — duplicate data
        '422':
          description: Validation / business rule error
    delete:
      tags:
        - Locations
      summary: 'Soft delete location (roles: SUPERADMIN, ADMIN)'
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — insufficient role
        '404':
          description: Not Found
        '409':
          description: Conflict — duplicate data
        '422':
          description: Validation / business rule error
  /feeders:
