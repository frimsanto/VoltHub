          schema:
            type: string
            enum:
              - GSM_4G
              - GSM_2G
              - RADIO_DATA
              - FO
              - ICON_GSM
              - ICON_IPVPN
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
